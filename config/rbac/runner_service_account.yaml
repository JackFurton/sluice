# The identity run pods execute as. It is separate from the controller's
# account on purpose: a run pod talks to a vendor API over the network and
# should not carry the controller's permissions if it is ever compromised.
#
# On GKE this is the account you bind to a Google service account with Workload
# Identity, so the BigQuery destination needs no service account key anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: sluice
    app.kubernetes.io/managed-by: kustomize
  name: runner
  namespace: system
