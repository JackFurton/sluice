# This rule is not used by the project sluice itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ingest.sluice.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sluice
    app.kubernetes.io/managed-by: kustomize
  name: ingestionsource-editor-role
rules:
- apiGroups:
  - ingest.sluice.dev
  resources:
  - ingestionsources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ingest.sluice.dev
  resources:
  - ingestionsources/status
  verbs:
  - get
