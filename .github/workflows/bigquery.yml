name: BigQuery

on:
  push:
  pull_request:

permissions: {}

jobs:
  sink:
    name: Sink against the emulator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The BigQuery sink is the part of this operator that touches a real
      # warehouse. Running it against the emulator is the difference between
      # "it compiles" and "it writes rows".
      - run: make test-bigquery
