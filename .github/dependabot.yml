version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the routine bumps. Anything touching the Kubernetes API
      # surface or the BigQuery client is worth reading on its own.
      go-dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/controller-runtime"
          - "cloud.google.com/go/bigquery"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR a month for all of them. Sixteen separate PRs for action bumps
      # is noise that trains people to stop reading Dependabot.
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]
